# Pas de repli « /* » ici : les redirections vivent dans public/_redirects, et
# une URL inconnue doit recevoir dist/404.html avec un vrai statut 404.

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"